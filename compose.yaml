# Laboratoire IAM : Keycloak en mode production, sa base PostgreSQL et l'application de démonstration.
# Démarrage : ./lab.sh up (génère les secrets, démarre Keycloak, applique Terraform, lance l'application).

name: keycloak-iam-lab

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?lancer ./lab.sh up pour générer .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      retries: 12

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: start
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?lancer ./lab.sh up pour générer .env}
      # URL publique : celle que voient le navigateur et l'application (issuer des jetons)
      KC_HOSTNAME: http://localhost:8080
      # HTTP accepté uniquement parce que tout reste sur localhost ; en production : TLS
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      # Compte de service temporaire utilisé par Terraform pour configurer le realm
      KC_BOOTSTRAP_ADMIN_CLIENT_ID: terraform
      KC_BOOTSTRAP_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?lancer ./lab.sh up pour générer .env}
    ports:
      - "127.0.0.1:8080:8080" # Keycloak
      - "127.0.0.1:3000:3000" # application (elle partage le réseau de Keycloak, voir plus bas)
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # L'image ne contient ni curl ni wget : requête HTTP en bash. Le realm master ne répond
      # qu'une fois l'initialisation terminée, compte de service compris (/health/ready répond avant).
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /realms/master HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          head -1 <&3 | grep -q ' 200 '
      interval: 5s
      retries: 36

  app:
    build: ./app
    # L'application partage la pile réseau de Keycloak : « localhost:8080 » désigne Keycloak
    # pour elle comme pour le navigateur, ce qui garde un issuer unique sans fichier hosts.
    network_mode: service:keycloak
    environment:
      ISSUER: http://localhost:8080/realms/demo
      CLIENT_ID: notes-web
      CLIENT_SECRET: ${NOTES_WEB_CLIENT_SECRET:?lancer ./lab.sh up pour générer .env}
      APP_URL: http://localhost:3000
      SESSION_SECRET: ${SESSION_SECRET:?lancer ./lab.sh up pour générer .env}
    depends_on:
      keycloak:
        condition: service_healthy

volumes:
  postgres-data:
