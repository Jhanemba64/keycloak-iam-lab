# Mises à jour proposées chaque mois, regroupées par écosystème ; montées majeures laissées à
# une décision manuelle. Les correctifs de sécurité sont proposés dès leur publication.
# Les PR visent dev, puis suivent la promotion dev → preprod → main.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  # Images Keycloak et PostgreSQL
  - package-ecosystem: docker-compose
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Application Notes : dépendances npm et image de base
  - package-ecosystem: npm
    directory: /app
    target-branch: dev
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      app:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /app
    target-branch: dev
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Tests Playwright (lab.sh prend l'image Docker de la même version)
  - package-ecosystem: npm
    directory: /tests
    target-branch: dev
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      tests:
        patterns: ["*"]

  # Providers Keycloak et random
  - package-ecosystem: terraform
    directory: /terraform
    target-branch: dev
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
